<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STL test</title>
<style>
html, body { height: 100%; margin: 0; }
body { display: grid; grid-template-columns: 1fr 260px; font: 12px/1.4 ui-monospace, Menlo, monospace; background: #111; color: #ddd; }
#stage { min-width: 0; min-height: 0; overflow: hidden; cursor: grab; }
#stage canvas { display: block; }
#panel { padding: 16px; border-left: 1px solid #333; overflow: auto; }
#panel h1 { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 14px; }
label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin: 0 0 12px; }
label input[type=range], label select { grid-column: 1 / -1; width: 100%; }
output { opacity: 0.6; }
button { font: inherit; padding: 6px 10px; margin: 0 6px 6px 0; }
h2 { font-size: 12px; font-weight: normal; opacity: 0.6; margin: 14px 0 6px; }
p { opacity: 0.6; }
body.bare { grid-template-columns: 1fr; }
body.bare #panel { display: none; }
@media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } #panel { border-left: 0; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="stage"></div>
<div id="panel">
<h1>STL test</h1>
<p id="file"></p>
<label>Colours <select data-k="theme"><option value="paper">Black on paper</option><option value="white">Black on white</option><option value="ink">Paper on black</option></select></label>
<label>Line <output></output><input type="range" data-k="line" min="0.5" max="6" step="0.25"></label>
<button id="front">Front view</button><button id="reset">Reset view</button>
<p>Drag to turn, scroll to zoom. To show another file, put its address in <code>?file=</code>.</p>
</div>
<script type="module">
import { STLLoader } from "./vendor/STLLoader.js";
import { outline, THEMES } from "./outline.js";

const q = new URLSearchParams(location.search);
const o = { theme: q.get("theme") || "paper", line: +(q.get("line") || 2) };
const file = q.get("file") || "/static/assets/images/logo-explore/almighty-logo.stl";
if (q.has("bare")) document.body.className = "bare";
const note = document.getElementById("file");
const view = outline(document.getElementById("stage"));
const dress = () => view.style(Object.assign({}, THEMES[o.theme] || THEMES.paper, o));
dress();
new STLLoader().load(file, g => {
    view.show(g);
    note.textContent = file.split("/").pop() + " · " + g.attributes.position.count / 3 + " triangles";
}, undefined, () => { note.textContent = "Could not load " + file; });

const inputs = [...document.querySelectorAll("[data-k]")];
function show() {
    inputs.forEach(i => {
        i.value = o[i.dataset.k];
        const out = i.parentNode.querySelector("output");
        if (out) out.textContent = o[i.dataset.k];
    });
}
inputs.forEach(i => i.addEventListener("input", () => {
    o[i.dataset.k] = i.type === "range" ? +i.value : i.value;
    dress(); show();
}));
document.getElementById("front").onclick = () => view.front();
document.getElementById("reset").onclick = () => view.home();
show();
</script>
</body>
</html>
